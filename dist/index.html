document.addEventListener('pointerdown',unlockNotificationAudio,{passive:true});
document.addEventListener('keydown',unlockNotificationAudio);
function playNotificationSound(){try{const ctx=notificationAudioContext;if(!ctx||ctx.state!=='running')return;const now=ctx.currentTime,osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(740,now);osc.frequency.setValueAtTime(988,now+0.09);gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(0.10,now+0.015);gain.gain.exponentialRampToValueAtTime(0.0001,now+0.25);osc.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+0.26)}catch{}}
function hasNewNotification(oldValue,newValue){try{const oldList=JSON.parse(oldValue||'[]'),newList=JSON.parse(newValue||'[]');if(!Array.isArray(oldList)||!Array.isArray(newList))return false;const existing=new Set(oldList.map(n=>n.id));return newList.some(n=>n&&n.id&&!n.read&&!existing.has(n.id))}catch{return false}}
function notificationKey(id){return 'uniloop-notifications-v1:'+id}
function unreadNotifications(){return currentSession?readArray(notificationKey(currentSession)).filter(n=>!n.read).length:0}
function notifyLocal(id,message,productId=null,kind="product",questionId=null){if(!id||id==='guest')return;try{let key=notificationKey(id),list=readArray(key);list.push({id:demoId(),message,time:new Date().toISOString(),read:false,productId,kind,questionId});localStorage.setItem(key,JSON.stringify(list.slice(-100)));if(id===currentSession){updateAvatar();playNotificationSound()}}catch{}}
function notificationProduct(n){if(Number.isSafeInteger(n.productId))return products.find(p=>p.id===n.productId)||null;let name=String(n.message||'').match(/「([^」]+)」/)?.[1];if(!name)return null;let matches=products.filter(p=>p.name===name);return matches.length===1?matches[0]:null}
function showNotifications(){if(!requireMember())return;let list=readArray(notificationKey(currentSession));let body=list.length?list.slice().reverse().map(n=>{let p=notificationProduct(n),tx=notificationTransaction(n),chat=n.kind==='chat'?getUnifiedChat(n.questionId):null;return `<article class="extra-card"><strong>${n.read?'已讀':'未讀'}</strong>${p||tx||chat?`<button class="notification-link" onclick="openNotification('${esc(n.id)}')"><p>${esc(n.message)}</p><small>點擊查看${chat?'聊天紀錄':tx||/收到一筆本機模擬申請/.test(n.message)?'模擬交易':n.kind==='question'||/提問/.test(n.message)?'商品問答':'商品'}</small></button>`:`<p>${esc(n.message)}</p><small class="notification-missing">商品已移除，或舊通知無法辨識商品。</small>`}<small> · ${esc(displayTime(n.time))}</small>${n.read?'':`<div class="extra-controls"><button onclick="markNotification('${esc(n.id)}')">標記已讀</button></div>`}</article>`}).join(''):'<div class="request-empty">目前沒有通知</div>';openModal(`<div class="form"><div class="eyebrow">LOCAL NOTIFICATIONS</div><h2>站內通知</h2><p class="notice">本機模擬通知，只會出現在此瀏覽器的展示帳號；不會發送到其他裝置。</p>${body}<div class="extra-controls"><button onclick="markAllNotifications()">全部標記已讀</button></div></div>`)}
function openNotification(id){if(!isMember())return;let key=notificationKey(currentSession),list=readArray(key),n=list.find(x=>x.id===id);if(!n)return;let p=notificationProduct(n),tx=notificationTransaction(n),chat=n.kind==='chat'?getUnifiedChat(n.questionId):null;if(!p&&!tx&&!chat){showNotifications();return}n.read=true;try{localStorage.setItem(key,JSON.stringify(list));updateAvatar()}catch{alert('無法儲存通知狀態。');return}if(chat){showUnifiedChat(chat.id);return}if(tx){showTransaction(tx.id);return}if(/收到一筆本機模擬申請/.test(n.message)){showRequests();return}if(n.kind==='question'&&/追蹤問答/.test(n.message)&&n.questionId){showQuestionChat(n.questionId);return}detail(p.id);if(n.kind==='question'||/提問/.test(n.message)){let node=n.questionId?document.getElementById('question-'+n.questionId):null;node=node||document.getElementById('product-questions');if(node){node.scrollIntoView({block:'center'});node.classList.add('qa-highlight')}}}
function markNotification(id){let key=notificationKey(currentSession),list=readArray(key);list.forEach(n=>{if(n.id===id)n.read=true});try{localStorage.setItem(key,JSON.stringify(list));updateAvatar();showNotifications()}catch{alert('無法儲存通知狀態。')}}

function deleteRequest(index){let key=scopedKey('uniloop-requests'),list=readArray(key);if(index<0||index>=list.length)return;if(!confirm('確定刪除這筆本機模擬申請紀錄？'))return;list.splice(index,1);try{localStorage.setItem(key,JSON.stringify(list));showRequests()}catch{alert('無法刪除紀錄，請檢查瀏覽器空間。')}}

function migrateLegacyTransactions(){try{let transactions=readArray(TRANSACTIONS_KEY),known=new Set(transactions.map(t=>t.legacyId).filter(Boolean)),updates=[];for(let a of accounts()){let key='uniloop-requests:'+a.id,records=readArray(key),changed=false;for(let r of records){let p=products.find(x=>x.id===r.productId);if(!p?.ownerId||p.ownerId===a.id)continue;if(!r.id){r.id=demoId();changed=true}if(known.has(r.id))continue;known.add(r.id);transactions.push({id:demoId(),legacyId:r.id,productId:p.id,product:r.product||p.name,buyerId:a.id,sellerId:p.ownerId,buyer:a.name,seller:p.seller,type:r.type||'買賣',status:'待賣家確認',time:r.time||new Date().toISOString(),messages:[{id:demoId(),authorId:a.id,author:a.name,text:r.message||'（原申請未附留言）',time:r.time||new Date().toISOString()}]})}if(changed)updates.push({key,records})}for(let u of updates)localStorage.setItem(u.key,JSON.stringify(u.records));localStorage.setItem(TRANSACTIONS_KEY,JSON.stringify(transactions))}catch{console.warn('舊申請暫時無法轉換，原紀錄仍保留。')}}
function notificationTransaction(n){let all=readArray(TRANSACTIONS_KEY),tx=n.kind==='transaction'?all.find(t=>t.id===n.questionId):null;if(tx&&(tx.sellerId===currentSession||tx.buyerId===currentSession))return tx;if(n.kind==='product'&&/收到一筆本機模擬申請/.test(n.message)){let p=notificationProduct(n),candidates=all.filter(t=>t.productId===p?.id&&t.sellerId===currentSession&&t.status==='待賣家確認');if(candidates.length===1)return candidates[0]}return null}

function showTransaction(id){let t=readArray(TRANSACTIONS_KEY).find(x=>x.id===id);if(!t||!isMember()||![t.buyerId,t.sellerId].includes(currentSession)){openModal('<div class="form"><h2>找不到交易</h2><p>這筆交易不存在，或不屬於目前帳號。</p><button class="pill" onclick="showRequests()">返回交易紀錄</button></div>');return}let chat=ensureUnifiedChat(t.productId,t.sellerId,t.buyerId,'買家提出交易申請',t.time);if(chat)showUnifiedChat(chat.id)}
function refreshProductSnapshot(){try{let raw=localStorage.getItem(USER_PRODUCTS_KEY);if(raw===null)return;let stored=JSON.parse(raw);if(!Array.isArray(stored))return;let own=stored.filter(p=>p&&Number.isSafeInteger(p.id)&&p.id>1000);products.splice(0,products.length,...products.filter(p=>!p.ownerDemo),...own)}catch{}}
function setTransactionStatus(id,status,reason=''){if(typeof navigator!=='undefined'&&navigator.locks?.request)return navigator.locks.request('uniloop-transaction-status',()=>runTransactionStatus(id,status,reason));return runTransactionStatus(id,status,reason)}
function runTransactionStatus(id,status,reason=''){if(!isMember())return;refreshProductSnapshot();let list=readArray(TRANSACTIONS_KEY),t=list.find(x=>x.id===id);if(!t)return;let buyer=currentSession===t.buyerId,seller=currentSession===t.sellerId;if(!buyer&&!seller)return;let allowed=(status==='已接受'&&seller&&t.status==='待賣家確認')||(status==='已拒絕'&&seller&&t.status==='待賣家確認')||(status==='買家已確認收貨'&&buyer&&t.status==='已接受')||(status==='已取消'&&buyer&&['待賣家確認','已接受','買家已確認收貨'].includes(t.status))||(status==='交易完成'&&seller&&t.status==='買家已確認收貨');if(!allowed){alert('目前身分或交易狀態無法執行此操作，請重新查看交易。');return}reason=String(reason||'').trim();if(status==='已取消'&&(!reason||reason.length>200||privateInfo(reason))){alert('請填寫 200 字以內的取消原因，請勿填入電話、地址或電子郵件。');return}let p=products.find(x=>x.id===t.productId&&x.ownerId===t.sellerId),previous=products.filter(x=>x.ownerDemo),next=previous,needProduct=false;if(status==='已接受'){if(!p||['預約中','交易完成','下架'].includes(p.status)||list.some(x=>x.id!==t.id&&x.productId===t.productId&&['已接受','買家已確認收貨','交易完成'].includes(x.status))){alert('商品目前無法接受新的申請。');return}t.previousProductStatus=p.status||'上架中';next=previous.map(x=>x.id===p.id?{...x,status:'預約中'}:x);needProduct=true}else if(status==='交易完成'){if(!p){alert('商品已移除，無法完成這筆模擬交易。');return}next=previous.map(x=>x.id===p.id?{...x,status:'交易完成'}:x);needProduct=true}else if((status==='已取消'||status==='已拒絕')&&p&&!['交易完成','下架'].includes(p.status)){let anotherActive=list.some(x=>x.id!==t.id&&x.productId===t.productId&&['已接受','買家已確認收貨'].includes(x.status));if(!anotherActive&&p.status!=='上架中'){next=previous.map(x=>x.id===p.id?{...x,status:'上架中'}:x);needProduct=true}}if(needProduct&&!persistMine(next))return;let now=new Date().toISOString();t.status=status;t.updatedAt=now;let closed=[];if(status==='交易完成'){for(let other of list){if(other.id!==t.id&&other.productId===t.productId&&other.status==='待賣家確認'){other.status='商品已成交';other.updatedAt=now;other.closedAt=now;closed.push(other)}}}if(status==='已接受')t.acceptedAt=now;if(status==='已拒絕')t.rejectedAt=now;if(status==='買家已確認收貨')t.buyerConfirmedAt=now;if(status==='交易完成')t.completedAt=now;if(status==='已取消'){t.cancelledAt=now;t.cancelReason=reason}try{localStorage.setItem(TRANSACTIONS_KEY,JSON.stringify(list))}catch{if(needProduct)persistMine(previous);alert('無法儲存交易狀態，請檢查瀏覽器空間。');return}for(let other of closed)notifyLocal(other.buyerId,`「${other.product}」已成交，您的申請已結束。`,other.productId,'transaction',other.id);let recipient=seller?t.buyerId:t.sellerId,phrases={'已接受':'賣家已接受模擬交易。','已拒絕':'賣家已拒絕模擬交易。','買家已確認收貨':'買家已確認收到商品，請賣家確認完成。','交易完成':'賣家已確認，模擬交易完成。','已取消':`買家已取消模擬交易，原因：${reason}`};notifyLocal(recipient,`「${t.product}」${phrases[status]}`,t.productId,'transaction',t.id);showTransaction(id)}
function showCancelTransaction(id){if(!isMember())return;let t=readArray(TRANSACTIONS_KEY).find(x=>x.id===id);if(!t||t.buyerId!==currentSession||!['待賣家確認','已接受','買家已確認收貨'].includes(t.status))return;openModal(`<div class="form"><h2>取消模擬交易？</h2><p>請說明取消原因，原因會以本機模擬通知與聊天室訊息提供給賣家。已接受的商品會視狀況恢復上架。</p><form onsubmit="confirmCancelTransaction(event,'${esc(id)}')"><label for="cancel-reason">取消原因 *</label><textarea id="cancel-reason" maxlength="200" required placeholder="例如：時間無法配合"></textarea><p class="small">請勿輸入電話、地址或電子郵件。</p><p id="cancel-error" class="hint" role="alert"></p><div class="cancel-reason-actions"><button class="extra-btn" type="button" onclick="showTransaction('${esc(id)}')">返回</button><button class="cancel-confirm" type="submit">確認取消</button></div></form></div>`)}
function confirmCancelTransaction(e,id){e.preventDefault();let reason=$('cancel-reason').value.trim();if(!reason||reason.length>200||privateInfo(reason)){$('cancel-error').textContent='請填寫 200 字以內的原因，且不要輸入電話、地址或電子郵件。';return}setTransactionStatus(id,'已取消',reason)}
function showQuestionChat(qid){let q=readArray(QUESTIONS_KEY).find(x=>x.id===qid),p=q&&products.find(x=>x.id===q.productId);if(!isMember()||!q||!p||!p.ownerId||![p.ownerId,q.authorId].includes(currentSession)){openModal('<div class="form"><h2>無法開啟追蹤問答</h2><p>僅提問者及本機商品賣家能使用此模擬對話。</p></div>');return}let chat=ensureUnifiedChat(p.id,p.ownerId,q.authorId,'買家從商品問答開啟聊天',q.time);if(chat)showUnifiedChat(chat.id)}

// Unified local chat; older question and transaction records remain untouched.

function ensureUnifiedChat(productId,sellerId,buyerId,reason,time,productName){if(!Number.isSafeInteger(productId)||!sellerId||!buyerId||sellerId===buyerId)return null;let list=readArray(UNIFIED_CHATS_KEY),c=list.find(x=>x.productId===productId&&x.sellerId===sellerId&&x.buyerId===buyerId);if(c)return c;let p=products.find(x=>x.id===productId),now=time||new Date().toISOString();c={id:demoId(),productId,sellerId,buyerId,product:productName||p?.name||'商品',reason:reason||'買家開啟商品洽談',time:now,messages:[]};try{localStorage.setItem(UNIFIED_CHATS_KEY,JSON.stringify([...list,c]));return c}catch{alert('無法建立本機聊天室，請檢查瀏覽器儲存空間。');return null}}
function migrateUnifiedChats(){for(let q of readArray(QUESTIONS_KEY)){let p=products.find(x=>x.id===q.productId);if(p?.ownerId&&q.authorId&&p.ownerId!==q.authorId)ensureUnifiedChat(p.id,p.ownerId,q.authorId,'買家從商品問答開啟聊天',q.time,p.name)}for(let t of readArray(TRANSACTIONS_KEY))ensureUnifiedChat(t.productId,t.sellerId,t.buyerId,'買家提出交易申請',t.time,t.product)}
function unreadChatNotifications(){return readArray(notificationKey(currentSession)).filter(n=>!n.read&&['chat','question','transaction'].includes(n.kind)).length}
function startSellerChat(id){if(soldProduct(id))return;let p=products.find(x=>x.id===id);if(!p)return;if(!isMember()){openModal(`<div class="form"><h2>登入後開啟聊天</h2><p>模擬聊天室需要使用展示帳號。</p><button class="pill" onclick="showAuth()">登入或註冊</button><button class="ghost continue-btn" onclick="showSeller(${id})">返回賣場</button></div>`);return}if(!p.ownerId){openModal(`<div class="form"><h2>示範商品沒有真實賣家</h2><p>請選擇同一瀏覽器中由其他展示帳號上架的商品，才能模擬聊天。</p><button class="pill" onclick="showSeller(${id})">返回賣場</button></div>`);return}if(p.ownerId===currentSession)return;let c=ensureUnifiedChat(p.id,p.ownerId,currentSession,'買家開啟商品洽談');if(c)showUnifiedChat(c.id)}
function chatEvents(c){let events=[{id:'origin',system:true,text:c.reason||'聊天室已開啟',time:c.time}];for(let q of readArray(QUESTIONS_KEY).filter(q=>q.productId===c.productId&&q.authorId===c.buyerId)){events.push({id:'q-'+q.id,authorId:q.authorId,author:q.author,text:q.text,time:q.time});if(q.reply)events.push({id:'r-'+q.id,authorId:c.sellerId,author:accounts().find(a=>a.id===c.sellerId)?.name||'賣家',text:q.reply.text,time:q.reply.time||q.time});for(let m of q.followups||[])events.push({...m,id:'f-'+q.id+'-'+m.id})}for(let t of readArray(TRANSACTIONS_KEY).filter(t=>t.productId===c.productId&&t.sellerId===c.sellerId&&t.buyerId===c.buyerId)){if(!(c.reason==='買家提出交易申請'&&c.time===t.time))events.push({id:'ts-'+t.id,system:true,text:'買家提出交易申請',time:t.time});for(let m of t.messages||[])events.push({...m,id:'tm-'+t.id+'-'+m.id});if(t.acceptedAt||t.status==='已接受')events.push({id:'ta-'+t.id,system:true,text:'賣家已接受模擬交易',time:t.acceptedAt||t.updatedAt||t.time});if(t.buyerConfirmedAt||t.status==='買家已確認收貨')events.push({id:'tb-'+t.id,system:true,text:'買家已確認收到商品，等待賣家確認',time:t.buyerConfirmedAt||t.updatedAt||t.time});if(t.status==='已拒絕')events.push({id:'tr-'+t.id,system:true,text:'賣家已拒絕模擬交易',time:t.rejectedAt||t.updatedAt||t.time});if(t.status==='已取消')events.push({id:'tx-'+t.id,system:true,text:'買家已取消交易，原因：'+(t.cancelReason||'未提供'),time:t.cancelledAt||t.updatedAt||t.time});if(t.status==='交易完成')events.push({id:'tc-'+t.id,system:true,text:'模擬交易已完成',time:t.completedAt||t.updatedAt||t.time});if(t.status==='商品已成交')events.push({id:'sold-'+t.id,system:true,text:'商品已成交，此申請已結束',time:t.closedAt||t.updatedAt||t.time})}for(let m of c.messages||[])events.push({...m,id:'um-'+m.id});return events.sort((a,b)=>(Date.parse(a.time)||0)-(Date.parse(b.time)||0))}
function showChatList(){if(!isMember()){openModal('<div class="form"><h2>登入後查看聊天紀錄</h2><p>展示聊天室只保存在目前瀏覽器，需登入展示帳號使用。</p><button class="pill" onclick="showAuth()">登入或註冊</button><button class="ghost continue-btn" onclick="closeModal()">繼續瀏覽</button></div>');return}migrateUnifiedChats();let chats=readArray(UNIFIED_CHATS_KEY).filter(c=>[c.buyerId,c.sellerId].includes(currentSession)).map(c=>({c,events:chatEvents(c)})).sort((a,b)=>(Date.parse(b.events.at(-1)?.time)||0)-(Date.parse(a.events.at(-1)?.time)||0));let content=chats.map(({c,events})=>{let other=accounts().find(a=>a.id===(currentSession===c.buyerId?c.sellerId:c.buyerId)),last=events.at(-1);return `<button class="chat-list-item" onclick="showUnifiedChat('${esc(c.id)}')"><strong>${esc(c.product)}</strong><span>${esc(other?.name||'展示帳號')} · ${currentSession===c.buyerId?'買家':'賣家'}</span><br><small>${esc(last?.text||'聊天室已開啟')} · ${esc(displayTime(last?.time||c.time))}</small></button>`}).join('');openModal(`<div class="form seller-form"><div class="eyebrow">MY CHATS</div><h2>聊天紀錄</h2><p class="notice">僅顯示此瀏覽器中該帳號參與的本機模擬聊天。</p>${content||'<div class="request-empty">目前沒有聊天紀錄<br><small>可從商品問答或賣場開啟聊天。</small></div>'}<button class="ghost continue-btn" onclick="closeModal()">關閉</button></div>`)}
function markChatRead(c){let key=notificationKey(currentSession),list=readArray(key),changed=false,txs=readArray(TRANSACTIONS_KEY),qs=readArray(QUESTIONS_KEY);for(let n of list){if(n.read)continue;let tx=n.kind==='transaction'?txs.find(t=>t.id===n.questionId):null,q=n.kind==='question'?qs.find(x=>x.id===n.questionId):null;let match=(n.kind==='chat'&&n.questionId===c.id)||(tx&&tx.productId===c.productId&&tx.buyerId===c.buyerId&&tx.sellerId===c.sellerId)||(q&&q.productId===c.productId&&q.authorId===c.buyerId);if(match){n.read=true;changed=true}}if(changed){try{localStorage.setItem(key,JSON.stringify(list));updateAvatar()}catch{}}}
function showUnifiedChat(id){let c=getUnifiedChat(id);if(!c){openModal('<div class="form"><h2>找不到聊天室</h2><p>聊天室不存在或不屬於目前帳號。</p><button class="pill" onclick="showChatList()">返回聊天紀錄</button></div>');return}markChatRead(c);let p=products.find(x=>x.id===c.productId),other=accounts().find(a=>a.id===(currentSession===c.buyerId?c.sellerId:c.buyerId)),events=chatEvents(c),txs=readArray(TRANSACTIONS_KEY).filter(t=>t.productId===c.productId&&t.buyerId===c.buyerId&&t.sellerId===c.sellerId),active=txs.filter(t=>['已接受','買家已確認收貨'].includes(t.status)).at(-1)||txs.filter(t=>t.status==='待賣家確認').at(-1),actions='';if(active?.status==='待賣家確認'&&currentSession===c.sellerId)actions=`<button class="pill" type="button" onclick="setTransactionStatus('${esc(active.id)}','已接受')">接受模擬交易</button><button class="decline-btn" type="button" onclick="setTransactionStatus('${esc(active.id)}','已拒絕')">拒絕模擬交易</button>`;else if(active?.status==='待賣家確認'&&currentSession===c.buyerId)actions=`<button class="cancel-btn" type="button" onclick="showCancelTransaction('${esc(active.id)}')">取消交易</button>`;else if(active?.status==='已接受'&&currentSession===c.buyerId)actions=`<button class="pill" type="button" onclick="setTransactionStatus('${esc(active.id)}','買家已確認收貨')">確認收到商品</button><button class="cancel-btn" type="button" onclick="showCancelTransaction('${esc(active.id)}')">取消交易</button>`;else if(active?.status==='買家已確認收貨'&&currentSession===c.buyerId)actions=`<button class="cancel-btn" type="button" onclick="showCancelTransaction('${esc(active.id)}')">取消交易</button>`;else if(active?.status==='買家已確認收貨'&&currentSession===c.sellerId)actions=`<button class="pill" type="button" onclick="setTransactionStatus('${esc(active.id)}','交易完成')">確認交易完成</button>`;else if(!active&&currentSession===c.buyerId&&p&&!['預約中','交易完成','下架'].includes(p.status))actions=`<button class="pill" type="button" onclick="apply(${p.id})">提出交易申請</button>`;let latest=active||txs.at(-1),bubbles=events.map(m=>m.system?`<div class="chat-system">${esc(m.text)}</div>`:`<div class="chat-bubble ${m.authorId===currentSession?'mine':''}"><small>${esc(m.author||'展示會員')} · ${esc(displayTime(m.time))}</small><p>${esc(m.text||'')}</p></div>`).join('');openModal(`<div class="form seller-form" data-live-kind="unified" data-live-id="${esc(id)}"><div class="eyebrow">LOCAL CHAT</div><div class="chat-header"><div class="chat-heading"><h2>${esc(other?.name||'展示帳號')}</h2><p>${esc(c.product)}${latest?' · '+esc(latest.status):''}</p></div><div class="chat-header-actions">${actions}</div></div><p class="notice chat-notice">本機模擬聊天，只供相同瀏覽器的展示帳號使用；請勿輸入電話、地址或電子郵件。</p>${p?`<div class="chat-action-bar"><button class="extra-btn" type="button" onclick="detail(${p.id})">查看商品</button></div>`:''}<div class="chat-messages" id="chat-messages">${bubbles}</div><form onsubmit="sendUnifiedChat(event,'${esc(id)}')"><label for="chat-input">輸入訊息</label><textarea id="chat-input" maxlength="300" required placeholder="輸入模擬訊息"></textarea><p id="chat-error" class="hint" role="alert"></p><button class="pill">送出訊息</button></form><button class="ghost continue-btn" onclick="showChatList()">返回聊天紀錄</button></div>`);let box=$('chat-messages');if(box)box.scrollTop=box.scrollHeight}
function sendUnifiedChat(e,id){e.preventDefault();let c=getUnifiedChat(id),text=$('chat-input').value.trim();if(!c||!text)return;if(privateInfo(text)){$('chat-error').textContent='請勿輸入電話、地址或電子郵件。';return}let all=readArray(UNIFIED_CHATS_KEY),chat=all.find(x=>x.id===id);if(!chat)return;chat.messages=Array.isArray(chat.messages)?chat.messages:[];chat.messages.push({id:demoId(),authorId:currentSession,author:currentUser().name,text,time:new Date().toISOString()});try{localStorage.setItem(UNIFIED_CHATS_KEY,JSON.stringify(all));let other=currentSession===chat.buyerId?chat.sellerId:chat.buyerId;notifyLocal(other,`「${chat.product}」收到一則模擬聊天訊息。`,chat.productId,'chat',chat.id);showUnifiedChat(id)}catch{$('chat-error').textContent='儲存失敗，請檢查瀏覽器空間。'}}
window.addEventListener('storage',e=>{if(e.key===USER_PRODUCTS_KEY){refreshProductSnapshot();options();render()}if(e.key&&e.key.startsWith('uniloop-notifications-v1:')){updateAvatar();if(currentSession&&e.key===notificationKey(currentSession)&&hasNewNotification(e.oldValue,e.newValue))playNotificationSound()}let view=document.querySelector('[data-live-kind="unified"]');if(!view||![UNIFIED_CHATS_KEY,QUESTIONS_KEY,TRANSACTIONS_KEY].includes(e.key))return;let input=$('chat-input'),draft=input?.value||'',focused=document.activeElement===input,id=view.dataset.liveId;showUnifiedChat(id);let next=$('chat-input');if(next){next.value=draft;if(focused)next.focus()}});

for(const base of ['uniloop-fav','uniloop-requests']){try{if(localStorage.getItem(base+':guest')===null&&localStorage.getItem(base)!==null)localStorage.setItem(base+':guest',localStorage.getItem(base))}catch{}}document.addEventListener('click',e=>{let box=$('account-box');if(box&&!box.contains(e.target))toggleMenu(false)});initAccount();

</script></body></html>
